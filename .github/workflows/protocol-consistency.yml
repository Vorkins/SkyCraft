name: Protocol consistency

on:
  push:
    paths:
      - "protocol/skycraft_protocol.h"
      - "fabric/src/main/java/dev/skycraft/link/Proto.java"
      - "tools/check_protocol.py"
  pull_request:
    paths:
      - "protocol/skycraft_protocol.h"
      - "fabric/src/main/java/dev/skycraft/link/Proto.java"
      - "tools/check_protocol.py"
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check C++/Java protocol mirror
        run: python tools/check_protocol.py
